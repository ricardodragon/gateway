server:
  port: 8080
#  ssl:
#    enabled: true
#    key-store-type: PKCS12
#    key-store: classpath:dibros.p12
#    key-store-password: 'dibros'

spring:
  application:
    name: gateway
  r2dbc:
    url: r2dbc:mysql://127.0.0.1:3306/dibros?allowPublicKeyRetrieval=true&sslMode=DISABLED&useTimezone=true&serverTimezone=UTC
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  cloud:
    gateway:
      server:
        server:
          webflux:
            default-filters:
              - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Vary, RETAIN_FIRST
              - RemoveResponseHeader=Transfer-Encoding
            discovery:
              locator:
                enabled: true
                lower-case-service-id: true

jwt:
  config:
    login-url: /auth/login
    type: "signed"
    private-key: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 25
  client:
    http-client:
      keep-alive-timeout: 30
      connection-idle-timeout-in-seconds: 30
    registerWithEureka: true
    fetchRegistry: true
    service-url:
      defaultZone: http://localhost:7081/eureka/
