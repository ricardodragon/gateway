server:
  port: 8080

spring:
  application:
    name: gateway
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "https://dibros.com.br"
                  - "https://*.dibros.com.br"
                  - "http://localhost"
                  - "http://localhost:*"
                  - "http://127.0.0.1"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept
                exposedHeaders:
                  - Authorization
                allowCredentials: true
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

jwt:
  config:
    login-url: /auth/login
    type: "signed"
    private-key: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 25
  client:
    http-client:
      keep-alive-timeout: 30
      connection-idle-timeout-in-seconds: 30
    registerWithEureka: true
    fetchRegistry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:7081/eureka/}
